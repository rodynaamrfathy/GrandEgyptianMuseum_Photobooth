name: Deploy frontend to S3 + CloudFront

# Builds the Next.js app with `output: 'export'`, syncs the resulting
# out/ directory to the FrontendBucket, and issues a CloudFront cache
# invalidation so changes show up immediately.
#
# Vercel is used only for local/staging previews; production hosting
# lives on S3 + CloudFront.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Webapp/package-lock.json

      - name: Install dependencies
        working-directory: Webapp
        run: npm ci

      - name: Type check
        working-directory: Webapp
        run: npm run type-check

      - name: Lint
        working-directory: Webapp
        run: npm run lint

      - name: Test
        working-directory: Webapp
        run: npm test -- --ci --passWithNoTests

      - name: Build static site
        working-directory: Webapp
        run: npm run build
        env:
          NEXT_PUBLIC_AWS_REGION: ${{ vars.NEXT_PUBLIC_AWS_REGION }}
          NEXT_PUBLIC_AWS_API_BASE_URL: ${{ vars.NEXT_PUBLIC_AWS_API_BASE_URL }}
          NEXT_PUBLIC_CARD_TEMPLATE_URL: ${{ vars.NEXT_PUBLIC_CARD_TEMPLATE_URL }}
          NEXT_PUBLIC_SAVE_EMAIL_URL: ${{ vars.NEXT_PUBLIC_SAVE_EMAIL_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get stack outputs
        id: stack
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ vars.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucketName`].OutputValue' \
            --output text)
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ vars.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
            --output text)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT

      - name: Sync out/ to S3
        run: |
          aws s3 sync Webapp/out/ s3://${{ steps.stack.outputs.bucket }}/ \
            --delete \
            --cache-control "public, max-age=300, must-revalidate"
          # index.html must always be revalidated quickly
          aws s3 cp Webapp/out/index.html s3://${{ steps.stack.outputs.bucket }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.stack.outputs.distribution_id }} \
            --paths "/*"
