name: Deploy to Vercel

# Single source of truth for the deploy is GitHub repo variables
# (NEXT_PUBLIC_AWS_*) plus secrets (VERCEL_*). Vercel Project Settings →
# Environments should stay empty for NEXT_PUBLIC_* so the two systems
# do not drift.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Webapp/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project
        working-directory: Webapp
        run: vercel link --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        working-directory: Webapp
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_AWS_REGION: ${{ vars.NEXT_PUBLIC_AWS_REGION }}
          NEXT_PUBLIC_AWS_API_BASE_URL: ${{ vars.NEXT_PUBLIC_AWS_API_BASE_URL }}
          NEXT_PUBLIC_CARD_TEMPLATE_URL: ${{ vars.NEXT_PUBLIC_CARD_TEMPLATE_URL }}
          NEXT_PUBLIC_SAVE_EMAIL_URL: ${{ vars.NEXT_PUBLIC_SAVE_EMAIL_URL }}

      - name: Deploy to production
        working-directory: Webapp
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
