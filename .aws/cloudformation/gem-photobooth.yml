AWSTemplateFormatVersion: '2010-09-09'
Description: GEM Photobooth infrastructure (S3 + 3 Lambdas + API Gateway HTTP API)

# ==================================================
# Conditions
# ==================================================
Conditions:
  HasKioskTrustedAccounts: !Not [!Equals [!Join ["", !Ref KioskTrustedAccountArns], ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

# ==================================================
# Tags
# ==================================================
# Apply stack-level tags at deploy time (covers resources that don't
# accept Tags inline, e.g. AWS::S3::BucketPolicy, AWS::Lambda::Permission,
# AWS::ApiGatewayV2::Api):
#
#   aws cloudformation deploy \
#     --stack-name gem-photobooth \
#     --template-file .aws/cloudformation/gem-photobooth.yml \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --tags Project=gem-photobooth Environment=prod
#
# CAPABILITY_NAMED_IAM (not CAPABILITY_IAM) is required because several IAM
# roles set an explicit RoleName (UploadLambdaRoleName, ApiAccessLogRole,
# KioskRole, etc.) — confirmed via `aws cloudformation validate-template`.
#
# Resources that don't propagate stack tags automatically get explicit
# Tags blocks below.
#
# ==================================================
# Parameters
# ==================================================
Parameters:
  UploadLambdaName:
    Type: String
    Default: UploadImageToS3

  GetImageLambdaName:
    Type: String
    Default: GetImageLambda

  SaveEmailLambdaName:
    Type: String
    Default: SaveEmailLambda

  DecryptTokenLambdaName:
    Type: String
    Default: DecryptTokenLambda

  DecryptTokenLambdaRoleName:
    Type: String
    Default: DecryptTokenLambdaRole

  UploadLambdaRoleName:
    Type: String
    Default: UploadImageLambdaRole

  GetImageLambdaRoleName:
    Type: String
    Default: GetImageLambdaRole

  SaveEmailLambdaRoleName:
    Type: String
    Default: SaveEmailLambdaRole

  EmailTableName:
    Type: String
    Default: GEMPhotoboothEmails

  AccessLogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365, 400, 545, 731, 1827, 3653]
    Description: CloudWatch Logs retention for the API Gateway access log group.

  KioskRoleName:
    Type: String
    Default: KioskUploadRole
    Description: IAM role that the kiosk capture software assumes to get
      short-lived credentials for signing POST /upload requests.

  KioskTrustedAccountArns:
    Type: CommaDelimitedList
    Default: ""
    Description: Comma-separated list of AWS account ARNs (e.g. arn:aws:iam::123456789012:root)
      allowed to assume KioskRole. Leave empty to grant no one (you must populate
      it before the role is usable; for local dev set it to your personal account
       ARN).

  AlarmEmail:
    Type: String
    Default: ""
    Description: Email address that receives CloudWatch alarm notifications. If
      empty, the SNS topic is created but no subscription is wired (alarms will
      still trigger in the AWS console, just no email).

  QRTokenKey:
    Type: String
    NoEcho: true
    Description: Base64-encoded 32-byte AES-256-GCM key shared with the kiosk.
      Must decode to exactly 32 bytes. Passed to the DecryptTokenLambda as the
      QR_TOKEN_KEY env var. Never expose this value to client-side code.

  BucketNamePrefix:
    Type: String
    Default: gem-photobooth-v1
    # Confirmed with IT: bucket created as gem-photobooth-v1, and the deploy
    # user's IAM policy S3 resource ARNs are scoped to this exact lowercase
    # prefix (replacing the old rodyna-v4 scoping).
    Description: Prefix for the S3 bucket name. The full name is
      <prefix>-<account>-<region>-<stack-name> so it is unique per stack.
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,30}$'
    ConstraintDescription: Lowercase letters, digits and hyphens; 2-31 chars.

Resources:

  # -----------------
  # S3 Bucket
  # -----------------
  UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Join
        - '-'
        - - !Ref BucketNamePrefix
          - !Ref AWS::AccountId
          - !Ref AWS::Region
          - !Select
              - 0
              - !Split
                  - '-'
                  - !Ref AWS::StackName
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfter30Days
            Status: Enabled
            ExpirationInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag

  # -----------------
  # DynamoDB Table for Emails
  # -----------------
  EmailTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref EmailTableName
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  # -----------------
  # Upload Lambda IAM Role
  # -----------------
  UploadLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref UploadLambdaRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3PutObjectPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${UploadBucket}/*
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  # -----------------
  # Upload Lambda Function (Node.js)
  # -----------------
  UploadLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref UploadLambdaName
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Role: !GetAtt UploadLambdaRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadBucket
          GET_IMAGE_API_URL: !Sub https://${PhotoboothAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/images
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod
      Code:
        ZipFile: |
          const { S3Client, PutObjectCommand } = require("@aws-sdk/client-s3");

          const s3 = new S3Client({ region: process.env.AWS_REGION });
          const BUCKET_NAME = process.env.BUCKET_NAME;
          const GET_IMAGE_API_URL = process.env.GET_IMAGE_API_URL.replace(/\/$/, "");

          exports.handler = async (event) => {
            try {
              const headers = Object.fromEntries(
                Object.entries(event.headers || {}).map(([k, v]) => [k.toLowerCase(), v])
              );

              const kioskName = headers["x-kiosk-name"];
              const filterName = headers["x-filter-name"];
              const timestamp = headers["x-timestamp"];

              if (!kioskName || !filterName || !timestamp) {
                return response(400, { message: "Missing required headers" });
              }

              const imageBuffer = event.isBase64Encoded
                ? Buffer.from(event.body, "base64")
                : Buffer.from(event.body, "utf8");

              const id = `${kioskName}_${filterName}_${timestamp}`;
              const key = `uploads/${kioskName}/${filterName}/${id}.png`;

              await s3.send(
                new PutObjectCommand({
                  Bucket: BUCKET_NAME,
                  Key: key,
                  Body: imageBuffer,
                  ContentType: "image/png"
                })
              );

              return response(200, { id, image_url: `${GET_IMAGE_API_URL}/${id}` });
            } catch (err) {
              console.error("Error:", err);
              return response(500, { message: "Upload failed" });
            }
          };

          function response(statusCode, body) {
            return {
              statusCode,
              headers: {
                "Content-Type": "application/json",
                "Access-Control-Allow-Origin": "*"
              },
              body: JSON.stringify(body)
            };
          }

  # -----------------
  # Get Image Lambda IAM Role
  # -----------------
  GetImageLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref GetImageLambdaRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GetImageS3Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${UploadBucket}/*
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  # -----------------
  # Get Image Lambda Function (Node.js)
  # -----------------
  GetImageLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref GetImageLambdaName
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Role: !GetAtt GetImageLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadBucket
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod
      Code:
        ZipFile: |
          const { S3Client, GetObjectCommand } = require("@aws-sdk/client-s3");
          const { getSignedUrl } = require("@aws-sdk/s3-request-presigner");

          const s3 = new S3Client({ region: process.env.AWS_REGION });
          const BUCKET = process.env.BUCKET_NAME;
          const EXPIRE = 60 * 60 * 24 * 7; // 7 days

          exports.handler = async (event) => {
            try {
              const id = event.pathParameters?.id;
              if (!id) return { statusCode: 400, body: "Missing id" };

              const [kioskName, filterName, timestamp] = id.split("_");
              if (!kioskName || !filterName || !timestamp) {
                return { statusCode: 400, body: "Invalid id" };
              }

              const key = `uploads/${kioskName}/${filterName}/${id}.png`;
              const command = new GetObjectCommand({ Bucket: BUCKET, Key: key });
              const url = await getSignedUrl(s3, command, { expiresIn: EXPIRE });

              return {
                statusCode: 302,
                headers: { Location: url, "Cache-Control": "no-store" },
                body: ""
              };
            } catch (err) {
              console.error("GetImage error:", err);
              return { statusCode: 500, body: "Internal Server Error" };
            }
          };

  # -----------------
  # Save Email Lambda IAM Role
  # -----------------
  SaveEmailLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref SaveEmailLambdaRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBPutPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt EmailTable.Arn
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  # -----------------
  # Save Email Lambda Function (Node.js)
  # -----------------
  SaveEmailLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref SaveEmailLambdaName
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Role: !GetAtt SaveEmailLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref EmailTableName
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod
      Code:
        ZipFile: |
          const { DynamoDBClient, PutItemCommand } = require("@aws-sdk/client-dynamodb");
          const { randomUUID } = require("crypto");

           const client = new DynamoDBClient({ region: process.env.AWS_REGION });
           const TABLE_NAME = process.env.TABLE_NAME;

           exports.handler = async (event) => {
             try {
               const body = JSON.parse(event.body);
               const { email, image_name, card_name, kiosk_name, filter_name } = body;

               if (!email) {
                 return response(400, { error: "Missing required field: email" });
               }

               const id = randomUUID();

               const item = {
                 id: { S: id },
                 email: { S: email },
                 image_name: { S: image_name || "" },
                 card_name: { S: card_name || "" },
                 kiosk_name: { S: kiosk_name || "default" },
                 filter_name: { S: filter_name || "default" },
                 timestamp: { S: new Date().toISOString() }
               };

               await client.send(new PutItemCommand({ TableName: TABLE_NAME, Item: item }));

               return response(200, { success: true, id });
             } catch (err) {
               console.error(err);
               return response(500, { error: "Internal Server Error" });
             }
           };

           function response(statusCode, body) {
             return {
               statusCode,
               headers: {
                 "Content-Type": "application/json",
                 "Access-Control-Allow-Origin": "*"
               },
               body: JSON.stringify(body)
             };
           }

  # -----------------
  # QR Token Key (Secrets Manager)
  # -----------------
  QRTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: gem-photobooth-qr-token-key
      Description: Base64-encoded AES-256-GCM key shared with the kiosk for QR token decryption
      SecretString: !Ref QRTokenKey
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  # -----------------
  # DecryptToken IAM Role
  # -----------------
  DecryptTokenLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref DecryptTokenLambdaRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GetQRTokenSecretPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref QRTokenSecret
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  # -----------------
  # DecryptToken Lambda Function (Node.js)
  # -----------------
  # Decrypts a kiosk-issued AES-256-GCM token, then resolves the
  # embedded imageId through the existing GetImage API and returns the
  # presigned S3 URL the browser can render.
  #
  # Any failure (bad Base64, wrong key, tampered tag, unknown imageId)
  # collapses to a single 404 response so the existence of valid tokens
  # cannot be probed by an attacker.
  DecryptTokenLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref DecryptTokenLambdaName
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Role: !GetAtt DecryptTokenLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          QR_TOKEN_SECRET_ARN: !Ref QRTokenSecret
          GET_IMAGE_API_URL: !Sub https://${PhotoboothAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/images
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod
      Code:
        ZipFile: |
          const { createDecipheriv, createHmac, timingSafeEqual } = require("crypto");

          // AES-256-CBC + HMAC-SHA256 (encrypt-then-MAC), matching the C#
          // kiosk SecureIdCodec exactly. Layout:
          //   Base64URL([16B IV][ciphertext][32B HMAC-SHA256(IV||ciphertext)])
          const IV_SIZE = 16;
          const MAC_SIZE = 32;
          const MASTER_KEY_MIN = 32;

          function base64UrlToBytes(s) {
            const standard = s.replace(/-/g, "+").replace(/_/g, "/");
            const padLength = (4 - (standard.length % 4)) % 4;
            return Buffer.from(standard + "=".repeat(padLength), "base64");
          }

          function deriveKeys(masterKey) {
            const encKey = createHmac("sha256", masterKey).update("enc").digest();
            const macKey = createHmac("sha256", masterKey).update("mac").digest();
            return { encKey, macKey };
          }

          // Throws on any failure; never log the key or the plaintext.
          function decryptToken(token, masterKey) {
            if (!Buffer.isBuffer(masterKey) || masterKey.length < MASTER_KEY_MIN) {
              throw new Error("invalid_key");
            }
            if (typeof token !== "string" || token.length === 0) {
              throw new Error("invalid_token");
            }
            let payload;
            try {
              payload = base64UrlToBytes(token);
            } catch (e) {
              throw new Error("invalid_token");
            }
            if (payload.length < IV_SIZE + MAC_SIZE) {
              throw new Error("invalid_token");
            }
            const cipherLen = payload.length - IV_SIZE - MAC_SIZE;
            const iv = payload.subarray(0, IV_SIZE);
            const ciphertext = payload.subarray(IV_SIZE, IV_SIZE + cipherLen);
            const mac = payload.subarray(IV_SIZE + cipherLen);

            const { encKey, macKey } = deriveKeys(masterKey);
            const expectedMac = createHmac("sha256", macKey)
              .update(Buffer.concat([iv, ciphertext]))
              .digest();
            if (
              mac.length !== expectedMac.length ||
              !timingSafeEqual(Buffer.from(mac), Buffer.from(expectedMac))
            ) {
              throw new Error("Token is invalid");
            }
            try {
              const decipher = createDecipheriv("aes-256-cbc", encKey, iv);
              const plain = Buffer.concat([decipher.update(ciphertext), decipher.final()]);
              return plain.toString("utf8");
            } catch (e) {
              throw new Error("invalid_token");
            }
          }

          const { SecretsManagerClient, GetSecretValueCommand } = require("@aws-sdk/client-secrets-manager");
          const smClient = new SecretsManagerClient({ region: process.env.AWS_REGION });
          let cachedKey;

          async function getKey() {
            if (cachedKey) return cachedKey;
            const secretArn = process.env.QR_TOKEN_SECRET_ARN;
            if (!secretArn) throw new Error("invalid_key");
            const secret = await smClient.send(new GetSecretValueCommand({ SecretId: secretArn }));
            const raw = secret.SecretString;
            if (!raw) throw new Error("invalid_key");
            const key = Buffer.from(raw, "base64");
            if (key.length < MASTER_KEY_MIN) throw new Error("invalid_key");
            cachedKey = key;
            return cachedKey;
          }

          function notFound() {
            return {
              statusCode: 404,
              headers: {
                "Content-Type": "application/json",
                "Access-Control-Allow-Origin": "*"
              },
              body: JSON.stringify({ error: "Not Found" })
            };
          }

          exports.handler = async (event) => {
            try {
              const params = event.queryStringParameters || {};
              const token = params.token;
              if (!token) return notFound();

              const key = await getKey();
              const imageId = decryptToken(token, key);

              // Resolve the image via the existing public GetImage endpoint,
              // which returns a 302 to a 7-day presigned S3 URL. We re-issue
              // the GET (no-store) and follow the redirect by asking fetch to
              // follow automatically, then return the final URL to the caller.
              const apiBase = (process.env.GET_IMAGE_API_URL || "").replace(/\/$/, "");
              const lookup = await fetch(`${apiBase}/${encodeURIComponent(imageId)}`, {
                cache: "no-store",
                redirect: "follow"
              });
              if (!lookup.ok) return notFound();
              // GetImage returns a 302 → presigned URL. After redirect:follow,
              // lookup.url is the presigned S3 URL. Some configurations proxy
              // the body as JSON; we accept either shape.
              const ct = lookup.headers.get("content-type") || "";
              if (ct.includes("application/json")) {
                const data = await lookup.json();
                if (!data || typeof data.image_url !== "string") return notFound();
                return {
                  statusCode: 200,
                  headers: {
                    "Content-Type": "application/json",
                    "Access-Control-Allow-Origin": "*",
                    "Cache-Control": "no-store"
                  },
                  body: JSON.stringify({ image_url: data.image_url })
                };
              }
              // Fall back to the resolved URL (302 followed).
              return {
                statusCode: 200,
                headers: {
                  "Content-Type": "application/json",
                  "Access-Control-Allow-Origin": "*",
                  "Cache-Control": "no-store"
                },
                body: JSON.stringify({ image_url: lookup.url })
              };
            } catch (err) {
              // Never expose the underlying error class. Anything that goes
              // wrong here — bad token, wrong key, imageId look-up failure —
              // collapses to the same 404.
              return notFound();
            }
          };

  # -----------------
  # API Gateway HTTP API
  # -----------------
  #PhotoboothAPI:
  #  Type: AWS::ApiGatewayV2::Api
  #  Properties:
  #   Name: GEMPhotoboothAPI
  #  ProtocolType: HTTP

  # -----------------
  # API Gateway HTTP API (Updated with CORS)
  # -----------------
  PhotoboothAPI:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: GEMPhotoboothAPI
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*' # For testing; in production use your specific domain
        AllowMethods:
          - POST
          - GET
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - x-kiosk-name
          - x-filter-name
          - x-timestamp
        MaxAge: 300

  # -----------------
  # Integrations
  # -----------------
  UploadIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PhotoboothAPI
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${UploadLambdaName}
      PayloadFormatVersion: '2.0'

  GetImageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PhotoboothAPI
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${GetImageLambdaName}
      PayloadFormatVersion: '2.0'

  SaveEmailIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PhotoboothAPI
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${SaveEmailLambdaName}
      PayloadFormatVersion: '2.0'

  # -----------------
  # Routes
  # -----------------
  UploadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoboothAPI
      RouteKey: POST /upload
      Target: !Sub integrations/${UploadIntegration}
      AuthorizationType: AWS_IAM

  GetImageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoboothAPI
      RouteKey: GET /images/{id}
      Target: !Sub integrations/${GetImageIntegration}

  SaveEmailRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoboothAPI
      RouteKey: POST /save-email
      Target: !Sub integrations/${SaveEmailIntegration}

  DecryptTokenIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PhotoboothAPI
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${DecryptTokenLambdaName}
      PayloadFormatVersion: '2.0'

  DecryptTokenRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PhotoboothAPI
      RouteKey: GET /decrypt-token
      Target: !Sub integrations/${DecryptTokenIntegration}

  # -----------------
  # API Gateway access logging
  # -----------------
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/apigateway/gem-photobooth-access
      RetentionInDays: !Ref AccessLogRetentionDays
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  ApiAccessLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ApiAccessLogRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  # -----------------
  # Stage (AutoDeploy creates and rolls a new deployment on every API change)
  # -----------------
  APIStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PhotoboothAPI
      StageName: prod
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{ "requestId":"$context.requestId", "ip":"$context.identity.sourceIp", "requestTime":"$context.requestTime", "httpMethod":"$context.httpMethod", "routeKey":"$context.routeKey", "status":"$context.status", "protocol":"$context.protocol", "responseLength":"$context.responseLength", "latencyMs":"$context.responseLatency" }'
  # -----------------
  # Kiosk IAM Role (assumed by the capture device to call POST /upload)
  # -----------------
  KioskRole:
    Type: AWS::IAM::Role
    Condition: HasKioskTrustedAccounts
    Properties:
      RoleName: !Ref KioskRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref KioskTrustedAccountArns
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: gem-photobooth-kiosk
      Policies:
        - PolicyName: InvokeUploadRoute
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: execute-api:Invoke
                Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PhotoboothAPI}/prod/POST/upload
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  # -----------------
  # Lambda Permissions
  # -----------------
  UploadLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PhotoboothAPI}/*/POST/upload

  GetImageLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetImageLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PhotoboothAPI}/*/GET/images/*

  SaveEmailLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SaveEmailLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PhotoboothAPI}/*/POST/save-email

  DecryptTokenLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DecryptTokenLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PhotoboothAPI}/*/GET/decrypt-token

  # -----------------
  # Lambda Log Groups (explicit retention; without these CloudWatch
  # auto-creates them on first invocation with "Never expire" retention)
  # -----------------
  UploadLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${UploadLambdaName}
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  GetImageLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetImageLambdaName}
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  SaveEmailLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${SaveEmailLambdaName}
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  DecryptTokenLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${DecryptTokenLambdaName}
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  # -----------------
  # CloudWatch Alarms
  # -----------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: gem-photobooth-alarms
      DisplayName: GEM Photobooth Alarms
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  UploadLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: gem-photobooth-upload-lambda-errors
      AlarmDescription: Upload Lambda errors > 0 in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref UploadLambdaName
      AlarmActions:
        - !Ref AlarmTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  GetImageLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: gem-photobooth-getimage-lambda-errors
      AlarmDescription: GetImage Lambda errors > 0 in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref GetImageLambdaName
      AlarmActions:
        - !Ref AlarmTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  SaveEmailLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: gem-photobooth-saveemail-lambda-errors
      AlarmDescription: SaveEmail Lambda errors > 0 in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref SaveEmailLambdaName
      AlarmActions:
        - !Ref AlarmTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  DecryptTokenLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: gem-photobooth-decrypttoken-lambda-errors
      AlarmDescription: DecryptToken Lambda errors > 0 in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref DecryptTokenLambdaName
      AlarmActions:
        - !Ref AlarmTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: gem-photobooth-api-5xx
      AlarmDescription: API Gateway 5XX errors > 5 in 5 minutes
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiId
          Value: !Ref PhotoboothAPI
        - Name: Stage
          Value: prod
      AlarmActions:
        - !Ref AlarmTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  DynamoDBThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: gem-photobooth-dynamodb-throttles
      AlarmDescription: DynamoDB throttled requests on EmailTable
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref EmailTableName
      AlarmActions:
        - !Ref AlarmTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  # -----------------
  # Static Frontend Hosting (S3 + CloudFront)
  # -----------------
  # The Next.js app is built with `output: 'export'` and the resulting
  # out/ directory is synced to this bucket manually (see README).
  # CloudFront serves the site over HTTPS using an Origin Access
  # Control (OAC) so the bucket itself stays private.
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Join
        - '-'
        - - !Sub "${BucketNamePrefix}-frontend"
          - !Ref AWS::AccountId
          - !Ref AWS::Region
          - !Select
              - 0
              - !Split
                  - '-'
                  - !Ref AWS::StackName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        SigningBehavior: always
        SigningProtocol: sigv4
        OriginAccessControlOriginType: s3
  # Static-export of a Next.js app cannot apply `next.config.js` headers
  # (the warning at build time says "headers are not applied when
  # exporting"), so we attach them at the CloudFront edge instead.
  FrontendSecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: https://*.s3.${AWS::Region}.amazonaws.com; font-src 'self' data:; connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com https://*.s3.${AWS::Region}.amazonaws.com https://res.cloudinary.com; frame-ancestors 'none'"
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=()"
              Override: true
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${FrontendBucket}/*
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: GEM Photobooth static frontend
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          ResponseHeadersPolicyId: !Ref FrontendSecurityHeadersPolicy
        # Custom error response: when S3 returns 403/404 for a path that
        # should be an SPA route, serve /index.html so Next.js client-side
        # routing can take over. Static assets (with real files) still
        # 404 correctly because they have explicit Cache-Control.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
      Tags:
        - Key: Project
          Value: gem-photobooth
        - Key: Environment
          Value: prod

Outputs:
  UploadBucketName:
    Description: S3 bucket for uploads
    Value: !Ref UploadBucket

  UploadAPIUrl:
    Description: API Gateway endpoint for image uploads
    Value: !Sub https://${PhotoboothAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/upload

  GetImageAPIUrl:
    Description: API Gateway endpoint for getting images
    Value: !Sub https://${PhotoboothAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/images

  SaveEmailAPIUrl:
    Description: API Gateway endpoint for saving emails
    Value: !Sub https://${PhotoboothAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/save-email

  DecryptTokenAPIUrl:
    Description: API Gateway endpoint that decrypts kiosk QR tokens and resolves the image URL
    Value: !Sub https://${PhotoboothAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/decrypt-token

  ApiAccessLogGroupName:
    Description: CloudWatch Logs group receiving API Gateway access logs
    Value: !Ref ApiAccessLogGroup

  KioskRoleArn:
    Description: ARN of the IAM role the kiosk capture device assumes to sign uploads
    Value: !If
      - HasKioskTrustedAccounts
      - !GetAtt KioskRole.Arn
      - ""

  AlarmTopicArn:
    Description: SNS topic receiving CloudWatch alarm notifications
    Value: !Ref AlarmTopic

  FrontendBucketName:
    Description: S3 bucket holding the exported static site (synced by CI)
    Value: !Ref FrontendBucket

  CloudFrontDomain:
    Description: Public CloudFront domain for the static site
    Value: !GetAtt FrontendDistribution.DomainName

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (used to issue cache invalidations from CI)
    Value: !Ref FrontendDistribution
